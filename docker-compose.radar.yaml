name: llmhub-radar

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

networks:
  llmhub-radar:
    driver: bridge

volumes:
  libsql-data:
    name: llmhub-radar-libsql-data
  media-data:
    name: llmhub-radar-media-data
  marketplace-postgres-data:
    name: llmhub-radar-marketplace-postgres-data

services:
  libsql:
    container_name: llmhub-radar-libsql
    image: ghcr.io/tursodatabase/libsql-server:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:15001:5001"
    volumes:
      - libsql-data:/var/lib/sqld
    environment:
      - SQLD_NODE=primary
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "perl -e 'use IO::Socket::INET; exit(IO::Socket::INET->new(PeerAddr=>\"127.0.0.1:8080\",Timeout=>1) ? 0 : 1);'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  marketplace-postgres:
    container_name: llmhub-radar-marketplace-postgres
    image: public.ecr.aws/docker/library/postgres:16-alpine
    logging: *default-logging
    networks:
      - llmhub-radar
    environment:
      POSTGRES_DB: ${MARKETPLACE_POSTGRES_DB:-llmhub_marketplace}
      POSTGRES_USER: ${MARKETPLACE_POSTGRES_USER:-llmhub}
      POSTGRES_PASSWORD: ${MARKETPLACE_POSTGRES_PASSWORD:-llmhub-local-only}
    volumes:
      - marketplace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db-migrate:
    container_name: llmhub-radar-db-migrate
    build:
      context: .
      dockerfile: apps/radar-worker/Dockerfile
    image: llmhub-radar/radar-worker:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    working_dir: /app/packages/db
    env_file:
      - .env.radar
    environment:
      - DATABASE_URL=http://libsql:8080
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_STATUS_PAGE_URL=${NEXT_PUBLIC_STATUS_PAGE_URL:-https://llm-hub.store}
      - AUTH_URL=${AUTH_URL:-https://app.llm-hub.store}
    command: ["bun", "src/migrate.mts"]
    depends_on:
      libsql:
        condition: service_healthy
    restart: "no"

  dashboard:
    container_name: llmhub-radar-dashboard
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-https://app.llm-hub.store}
        NEXT_PUBLIC_MARKETPLACE_API_URL: ${NEXT_PUBLIC_MARKETPLACE_API_URL:-https://llm-hub.store}
        NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-https://llm-hub.store}
        NEXT_PUBLIC_STATUS_PAGE_URL: ${NEXT_PUBLIC_STATUS_PAGE_URL:-https://llm-hub.store}
    image: llmhub-radar/dashboard:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.radar
    environment:
      - DATABASE_URL=http://libsql:8080
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_MARKETPLACE_API_URL=${NEXT_PUBLIC_MARKETPLACE_API_URL:-https://llm-hub.store}
      - NEXT_PUBLIC_MARKETPLACE_URL=${NEXT_PUBLIC_MARKETPLACE_URL:-https://llm-hub.store}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_STATUS_PAGE_URL=${NEXT_PUBLIC_STATUS_PAGE_URL:-https://llm-hub.store}
      - AUTH_URL=${AUTH_URL:-https://app.llm-hub.store}
      - MEDIA_STORAGE_ROOT=/app/data/media
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    volumes:
      - media-data:/app/data/media
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      libsql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  status-page:
    container_name: llmhub-radar-status-page
    build:
      context: .
      dockerfile: apps/status-page/Dockerfile
      args:
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-https://app.llm-hub.store}
        NEXT_PUBLIC_STATUS_PAGE_URL: ${NEXT_PUBLIC_STATUS_PAGE_URL:-https://llm-hub.store}
    image: llmhub-radar/status-page:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.radar
    environment:
      - DATABASE_URL=http://libsql:8080
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_STATUS_PAGE_URL=${NEXT_PUBLIC_STATUS_PAGE_URL:-https://llm-hub.store}
      - AUTH_URL=${AUTH_URL:-https://app.llm-hub.store}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      libsql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  radar-probe-worker:
    container_name: llmhub-radar-probe-worker
    build:
      context: .
      dockerfile: apps/radar-worker/Dockerfile
    image: llmhub-radar/radar-worker:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    env_file:
      - .env.radar
    environment:
      - DATABASE_URL=http://libsql:8080
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_STATUS_PAGE_URL=${NEXT_PUBLIC_STATUS_PAGE_URL:-https://llm-hub.store}
      - AUTH_URL=${AUTH_URL:-https://app.llm-hub.store}
    command: ["bun", "src/scripts/radar-cron-loop.ts"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      libsql:
        condition: service_healthy
    restart: unless-stopped

  radar-notification-worker:
    container_name: llmhub-radar-notification-worker
    profiles:
      - notifications
    build:
      context: .
      dockerfile: apps/radar-worker/Dockerfile
    image: llmhub-radar/radar-worker:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    env_file:
      - .env.radar
    environment:
      - DATABASE_URL=http://libsql:8080
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://app.llm-hub.store}
      - NEXT_PUBLIC_STATUS_PAGE_URL=${NEXT_PUBLIC_STATUS_PAGE_URL:-https://llm-hub.store}
      - AUTH_URL=${AUTH_URL:-https://app.llm-hub.store}
    command: ["bun", "src/scripts/radar-notification-loop.ts"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      libsql:
        condition: service_healthy
    restart: unless-stopped

  marketplace-migrate:
    container_name: llmhub-radar-marketplace-migrate
    build:
      context: .
      dockerfile: apps/marketplace-api/Dockerfile
    image: llmhub-radar/marketplace-api:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    working_dir: /app/packages/marketplace-db
    environment:
      MARKETPLACE_DATABASE_URL: ${MARKETPLACE_DATABASE_URL:-postgres://llmhub:llmhub-local-only@marketplace-postgres:5432/llmhub_marketplace}
    command: ["bun", "src/migrate.ts"]
    depends_on:
      marketplace-postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  marketplace-api:
    container_name: llmhub-radar-marketplace-api
    build:
      context: .
      dockerfile: apps/marketplace-api/Dockerfile
    image: llmhub-radar/marketplace-api:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      MARKETPLACE_DATABASE_URL: ${MARKETPLACE_DATABASE_URL:-postgres://llmhub:llmhub-local-only@marketplace-postgres:5432/llmhub_marketplace}
      MARKETPLACE_PUBLIC_ORIGIN: ${MARKETPLACE_PUBLIC_ORIGIN:-https://llm-hub.store}
      PORT: 3010
    depends_on:
      marketplace-migrate:
        condition: service_completed_successfully
      marketplace-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e 'const response = await fetch(\"http://127.0.0.1:3010/health\"); if (!response.ok) process.exit(1)'",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  marketplace-maintenance:
    container_name: llmhub-radar-marketplace-maintenance
    build:
      context: .
      dockerfile: apps/marketplace-api/Dockerfile
    image: llmhub-radar/marketplace-api:latest
    logging: *default-logging
    networks:
      - llmhub-radar
    working_dir: /app/packages/marketplace-db
    environment:
      MARKETPLACE_DATABASE_URL: ${MARKETPLACE_DATABASE_URL:-postgres://llmhub:llmhub-local-only@marketplace-postgres:5432/llmhub_marketplace}
      MARKETPLACE_LEGACY_PUBLIC_URL: ${MARKETPLACE_LEGACY_PUBLIC_URL:-https://llm-hub.store}
      MARKETPLACE_SYNC_INTERVAL_MS: ${MARKETPLACE_SYNC_INTERVAL_MS:-600000}
      MARKETPLACE_CLEANUP_INTERVAL_MS: ${MARKETPLACE_CLEANUP_INTERVAL_MS:-86400000}
    command: ["bun", "src/run-maintenance-loop.ts"]
    depends_on:
      marketplace-migrate:
        condition: service_completed_successfully
      status-page:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
