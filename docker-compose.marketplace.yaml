name: llmhub-marketplace-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llmhub_marketplace
      POSTGRES_USER: llmhub
      POSTGRES_PASSWORD: llmhub
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmhub -d llmhub_marketplace"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data

volumes:
  marketplace_postgres_data:
