name: LLMHub Radar Build Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish. Empty uses YYYYMMDDHHMM-shortsha."
        required: false
        type: string
      push_latest:
        description: "Also update latest tags."
        required: false
        default: false
        type: boolean

concurrency:
  group: llmhub-radar-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Preflight
    uses: ./.github/workflows/llmhub-radar-ci.yml
    secrets: inherit

  resolve:
    name: Resolve Image Tag
    runs-on: ubuntu-latest
    needs:
      - preflight
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - name: Resolve owner
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          if [ -n "${IMAGE_TAG_INPUT}" ]; then
            TAG="${IMAGE_TAG_INPUT}"
          else
            TAG="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $TAG" >&2
            exit 2
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - resolve
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dashboard
            dockerfile: apps/dashboard/Dockerfile
            image_suffix: dashboard
          - service: status-page
            dockerfile: apps/status-page/Dockerfile
            image_suffix: status-page
          - service: radar-worker
            dockerfile: apps/radar-worker/Dockerfile
            image_suffix: radar-worker
          - service: marketplace-api
            dockerfile: apps/marketplace-api/Dockerfile
            image_suffix: marketplace-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner_lc }}/llmhub-radar-${{ matrix.image_suffix }}"
          {
            echo "tags<<EOF"
            echo "$IMAGE:${{ needs.resolve.outputs.image_tag }}"
            echo "$IMAGE:sha-${GITHUB_SHA::7}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha,scope=llmhub-radar-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=llmhub-radar-${{ matrix.service }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_DASHBOARD_URL=https://app.llm-hub.store
            NEXT_PUBLIC_MARKETPLACE_API_URL=https://llm-hub.store
            NEXT_PUBLIC_MARKETPLACE_URL=https://llm-hub.store
            NEXT_PUBLIC_STATUS_PAGE_URL=https://llm-hub.store

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs:
      - resolve
      - build
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## LLMHub Radar images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`${{ needs.resolve.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with workflow **LLMHub Radar Deploy** and the same tag." >> "$GITHUB_STEP_SUMMARY"
