name: LLMHub Radar CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/llmhub-radar-*.yml"
      - "apps/dashboard/**"
      - "apps/status-page/**"
      - "apps/storefront/**"
      - "apps/marketplace-api/**"
      - "apps/workflows/src/radar/**"
      - "packages/api/**"
      - "packages/db/**"
      - "packages/services/src/radar/**"
      - "packages/marketplace-db/**"
      - "docker-compose.radar*.yaml"
      - "docker-compose.marketplace.yaml"
      - "docs/LLMHUB_RADAR*.md"
      - "docs/MARKETPLACE*.md"
      - "scripts/deploy-llmhub-radar.sh"
      - "pnpm-lock.yaml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/llmhub-radar-*.yml"
      - "apps/dashboard/**"
      - "apps/status-page/**"
      - "apps/storefront/**"
      - "apps/marketplace-api/**"
      - "apps/workflows/src/radar/**"
      - "packages/api/**"
      - "packages/db/**"
      - "packages/services/src/radar/**"
      - "packages/marketplace-db/**"
      - "docker-compose.radar*.yaml"
      - "docker-compose.marketplace.yaml"
      - "docs/LLMHUB_RADAR*.md"
      - "docs/MARKETPLACE*.md"
      - "scripts/deploy-llmhub-radar.sh"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: llmhub-radar-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 8080:8080
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: llmhub_marketplace_test
          POSTGRES_USER: llmhub
          POSTGRES_PASSWORD: llmhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmhub -d llmhub_marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AUTH_SECRET: ci-auth-secret-min-32-characters-long
      NEXTAUTH_SECRET: ci-nextauth-secret-min-32-characters-long
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://app.llm-hub.store
      CRON_SECRET: ci-cron-secret
      DATABASE_AUTH_TOKEN: basic:token
      DATABASE_URL: http://127.0.0.1:8080
      MARKETPLACE_DATABASE_URL: postgres://llmhub:llmhub@127.0.0.1:5432/llmhub_marketplace_test
      MARKETPLACE_TEST_DATABASE_URL: postgres://llmhub:llmhub@127.0.0.1:5432/llmhub_marketplace_test
      PROJECT_ID_VERCEL: ci-vercel-project
      STRIPE_SECRET_KEY: sk_test_ci
      TEAM_ID_VERCEL: ci-vercel-team
      TINY_BIRD_API_KEY: ci-tinybird-key
      UNKEY_API_ID: ci-unkey-api
      UNKEY_TOKEN: ci-unkey-token
      VERCEL_AUTH_BEARER_TOKEN: ci-vercel-token
      NEXT_PUBLIC_DASHBOARD_URL: https://app.llm-hub.store
      NEXT_PUBLIC_STATUS_PAGE_URL: https://llm-hub.store
      NEXT_PUBLIC_URL: https://app.llm-hub.store
      RADAR_CREDENTIAL_SECRET: ci-radar-credential-secret-min-32-characters
      RESEND_API_KEY: test
      RESEND_FROM: notifications@llm-hub.store
      STATUS_PAGE_URL: http://127.0.0.1:3001
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whitespace
        run: git diff --check

      - name: Validate static storefront
        run: |
          test -s apps/storefront/index.html
          test -s apps/storefront/model.html
          test -s apps/storefront/provider.html
          grep -Fq 'LLMHub Marketplace' apps/storefront/index.html
          ! grep -R 'mock-data.js' apps/storefront/*.html apps/storefront/*.js
          for file in apps/storefront/*.js; do node --check "$file"; done

      - name: Check focused formatting
        run: |
          pnpm exec oxfmt --check \
            apps/dashboard/src/app/layout.tsx \
            apps/status-page/src/app/layout.tsx \
            apps/dashboard/src/app/globals.css \
            apps/status-page/src/app/globals.css \
            packages/services/src/radar/priority-probe.ts \
            packages/services/src/radar/priority-probe.test.ts \
            packages/services/src/radar/cron.ts \
            apps/dashboard/src/scripts/radar-cron-loop.ts \
            packages/api/src/router/statusPage.ts \
            'packages/marketplace-db/src/**/*.ts' \
            packages/marketplace-db/drizzle.config.ts \
            packages/marketplace-db/package.json \
            'apps/marketplace-api/src/**/*.ts' \
            apps/marketplace-api/package.json

      - name: Lint focused release files
        run: |
          pnpm exec oxlint \
            apps/dashboard/src/app/layout.tsx \
            apps/status-page/src/app/layout.tsx \
            packages/services/src/radar/priority-probe.ts \
            packages/services/src/radar/priority-probe.test.ts \
            packages/services/src/radar/cron.ts \
            apps/dashboard/src/scripts/radar-cron-loop.ts \
            packages/api/src/router/statusPage.ts \
            packages/marketplace-db/src \
            packages/marketplace-db/drizzle.config.ts \
            apps/marketplace-api/src

      - name: Verify migrations
        run: pnpm --filter @openstatus/db verify:radar-migrations

      - name: Type check services
        run: pnpm --filter @openstatus/services tsc

      - name: Type check API
        run: pnpm --filter @openstatus/api exec tsc --noEmit

      - name: Type check dashboard
        run: pnpm --filter @openstatus/dashboard tsc

      - name: Type check status page
        run: pnpm --filter @openstatus/status-page tsc

      - name: Migrate Radar test database
        run: pnpm --filter @openstatus/db exec bun src/migrate.mts

      - name: Run radar service tests
        working-directory: packages/services
        run: bun test src/radar

      - name: Run media upload safety tests
        working-directory: packages/api
        run: bun test src/router/blob.test.ts

      - name: Run workflow radar tests
        working-directory: apps/workflows
        run: bun test src/radar/radar.test.ts

      - name: Migrate Marketplace test database
        run: pnpm --filter @llmhub/marketplace-db migrate

      - name: Type check Marketplace packages
        run: |
          pnpm --filter @llmhub/marketplace-db typecheck
          pnpm --filter @llmhub/marketplace-api typecheck

      - name: Run Marketplace tests
        run: |
          pnpm --filter @llmhub/marketplace-db test
          pnpm --filter @llmhub/marketplace-api test

      - name: Build dashboard
        run: pnpm --filter @openstatus/dashboard build

      - name: Build status page
        run: pnpm --filter @openstatus/status-page build
